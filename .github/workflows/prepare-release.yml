name: Prepare release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}
concurrency:
  group: release-cycle
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/dev' && vars.RELEASE_AUTOMATION_READY == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-automation.mjs prepare
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        if: ${{ steps.gate.outputs.ready == 'true' }}
        with:
          target-branch: dev
          skip-github-release: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Dispatch exact preparation head from trusted main workflow
        if: ${{ steps.gate.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-automation.mjs dispatch
