name: Release

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Recover an existing release only'
        required: true
        type: choice
        options: [retry]
      tag:
        description: 'Existing stable vX.Y.Z release'
        required: true
        type: string

permissions: {}
concurrency:
  group: release-cycle
  cancel-in-progress: false

jobs:
  target:
    if: ${{ github.ref == 'refs/heads/main' && vars.RELEASE_AUTOMATION_READY == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/release-automation.mjs finalize

  publish:
    needs: target
    if: ${{ needs.target.result == 'success' && vars.PUBLICATION_READY == 'true' }}
    runs-on: ubuntu-24.04
    environment: publication
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Revalidate exact promotion identity after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: retry
          RELEASE_TAG: ${{ needs.target.outputs.tag }}
        run: node scripts/release-automation.mjs finalize
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact tag checkout
        env:
          RELEASE_TAG: ${{ needs.target.outputs.tag }}
          RELEASE_SHA: ${{ needs.target.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm test
      - run: npm run check:package
      - name: Pack one artifact for both registries
        run: |
          mkdir -p "$RUNNER_TEMP/publish"
          npm pack --json --pack-destination "$RUNNER_TEMP/publish" > "$RUNNER_TEMP/pack.json"
          node -e 'const fs = require("node:fs"); const [p] = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pack.json")); fs.appendFileSync(process.env.GITHUB_ENV, "TARBALL=" + process.env.RUNNER_TEMP + "/publish/" + p.filename + "\n")'
      - name: Publish npm with OIDC or verify identical existing bytes
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-public.npmrc
        run: |
          printf 'registry=https://registry.npmjs.org/\n@ivannovr:registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          node scripts/publish-registry.mjs https://registry.npmjs.org "$TARBALL"
      - name: Publish GitHub Packages with isolated authentication
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-github.npmrc
        run: |
          printf 'registry=https://registry.npmjs.org/\n@ivannovr:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > "$NPM_CONFIG_USERCONFIG"
          node scripts/publish-registry.mjs https://npm.pkg.github.com "$TARBALL"

  complete:
    needs: [target, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Complete preparation and create or redispatch reverse synchronization
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: retry
          RELEASE_TAG: ${{ needs.target.outputs.tag }}
        run: node scripts/release-automation.mjs complete
